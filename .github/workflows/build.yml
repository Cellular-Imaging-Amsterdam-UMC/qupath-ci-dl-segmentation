name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - run: ./gradlew --no-daemon build
      - run: python3 -m py_compile src/main/resources/qupath/ext/cidl/backend.py
      - uses: actions/upload-artifact@v6
        with:
          name: qupath-ci-dl-segmentation
          path: build/libs/*.jar
